  <h1 style="text-align:center;">Login</h1>

  <body>

  <p>Please Login in to view the Statistics and Leaderboard</p>

  <form method="POST" id="login">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        placeholder="Enter email"
      />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        placeholder="Enter password"
      />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>

  <br>

  <p>If you don't have an account please sign-up: <a href="signup.html"><button class="btn btn-primary">Sign Up</button></a> </p>
